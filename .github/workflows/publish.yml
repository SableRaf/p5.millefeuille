name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC token exchange with npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify publishedVersions includes this version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_VERSION="$PKG_VERSION" node -e "
            const v = process.env.PKG_VERSION;
            const list = require('./package.json').publishedVersions || [];
            if (!list.includes(v)) {
              console.error('Error: publishedVersions does not include ' + v);
              console.error('Add it to package.json before tagging.');
              process.exit(1);
            }
          "

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tarball contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts --provenance
